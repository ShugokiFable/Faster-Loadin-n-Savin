name: CI

on:
  push:
    branches: [latest]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build x86-64-v2
        shell: pwsh
        run: ./build.ps1 -BuildTag x86-64-v2 -TargetCPU x86-64-v2

      - name: Build x86-64-v3
        shell: pwsh
        run: ./build.ps1 -BuildTag x86-64-v3 -TargetCPU x86-64-v3

      - name: Package
        shell: pwsh
        run: ./package-release.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Faster-Loadin-and-Savin-package
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: Faster-Loadin-and-Savin-package
          path: pkg

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: pkg/*
